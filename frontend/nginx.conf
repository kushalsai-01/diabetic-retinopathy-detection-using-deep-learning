server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve React app — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20M;
    }

    # Proxy heatmap static files
    location /heatmaps/ {
        proxy_pass http://backend:8000/heatmaps/;
    }

    # Proxy uploaded image static files
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
    }

    # Proxy PDF report static files
    location /reports/ {
        proxy_pass http://backend:8000/reports/;
    }
}
